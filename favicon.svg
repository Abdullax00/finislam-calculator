<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c553d" />
      <stop offset="45%" stop-color="#123227" />
      <stop offset="100%" stop-color="#081c15" />
    </linearGradient>

    <!-- Top Ambient Highlight -->
    <radialGradient id="topGlow" cx="50%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#2a7a58" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#123227" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Gradient for Display & Accent -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae792" />
      <stop offset="45%" stop-color="#e2ba41" />
      <stop offset="100%" stop-color="#b88e1e" />
    </linearGradient>

    <!-- Subtle Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae792" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#e2ba41" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c9a328" stop-opacity="0.4" />
    </linearGradient>

    <!-- Button Gradient Normal -->
    <linearGradient id="btnNormal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f523f" />
      <stop offset="100%" stop-color="#123528" />
    </linearGradient>

    <!-- Button Gradient Function -->
    <linearGradient id="btnFunc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#296b53" />
      <stop offset="100%" stop-color="#174434" />
    </linearGradient>

    <!-- Drop Shadow Filter for Calculator Body -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    
    <!-- Button Inner Highlight -->
    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Canvas Background (Full Bleed for iOS & Android App Icon) -->
  <rect width="512" height="512" fill="url(#bg)" />
  <rect width="512" height="512" fill="url(#topGlow)" />

  <!-- Subtle Inner Border of Icon -->
  <rect x="2" y="2" width="508" height="508" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Calculator Main Body -->
  <g filter="url(#shadow)">
    <!-- Body Frame -->
    <rect x="96" y="66" width="320" height="380" rx="44" ry="44" fill="#0c241c" stroke="url(#goldBorder)" stroke-width="2.5" />
    
    <!-- Screen / Display Area -->
    <rect x="124" y="96" width="264" height="74" rx="20" ry="20" fill="#05150f" stroke="rgba(226, 186, 65, 0.25)" stroke-width="1.5" />
    
    <!-- Screen Sub-Label / Brand -->
    <text x="144" y="122" fill="#588e78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">FINISLAM</text>

    <!-- Screen Numbers (Radiant Gold) -->
    <text x="368" y="148" text-anchor="end" fill="url(#gold)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">148 000 ₽</text>

    <!-- Row 1 Buttons (Clear, Plus/Minus, Percent, Divide) -->
    <g filter="url(#btnShadow)">
      <!-- C -->
      <rect x="124" y="190" width="54" height="48" rx="14" fill="url(#btnFunc)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="151" y="221" text-anchor="middle" fill="#8fe3bf" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="700">C</text>

      <!-- ± -->
      <rect x="194" y="190" width="54" height="48" rx="14" fill="url(#btnFunc)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="221" y="221" text-anchor="middle" fill="#8fe3bf" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="600">±</text>

      <!-- % -->
      <rect x="264" y="190" width="54" height="48" rx="14" fill="url(#btnFunc)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="291" y="221" text-anchor="middle" fill="#8fe3bf" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="600">%</text>

      <!-- ÷ -->
      <rect x="334" y="190" width="54" height="48" rx="14" fill="url(#btnFunc)" stroke="rgba(226,186,65,0.3)" stroke-width="1" />
      <text x="361" y="222" text-anchor="middle" fill="url(#gold)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="600">÷</text>
    </g>

    <!-- Row 2 Buttons (7, 8, 9, ×) -->
    <g filter="url(#btnShadow)">
      <rect x="124" y="250" width="54" height="48" rx="14" fill="url(#btnNormal)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="151" y="281" text-anchor="middle" fill="#f0faf5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="600">7</text>

      <rect x="194" y="250" width="54" height="48" rx="14" fill="url(#btnNormal)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="221" y="281" text-anchor="middle" fill="#f0faf5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="600">8</text>

      <rect x="264" y="250" width="54" height="48" rx="14" fill="url(#btnNormal)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="291" y="281" text-anchor="middle" fill="#f0faf5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="600">9</text>

      <rect x="334" y="250" width="54" height="48" rx="14" fill="url(#btnFunc)" stroke="rgba(226,186,65,0.3)" stroke-width="1" />
      <text x="361" y="282" text-anchor="middle" fill="url(#gold)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="600">×</text>
    </g>

    <!-- Row 3 Buttons (4, 5, 6, −) -->
    <g filter="url(#btnShadow)">
      <rect x="124" y="310" width="54" height="48" rx="14" fill="url(#btnNormal)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="151" y="341" text-anchor="middle" fill="#f0faf5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="600">4</text>

      <rect x="194" y="310" width="54" height="48" rx="14" fill="url(#btnNormal)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="221" y="341" text-anchor="middle" fill="#f0faf5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="600">5</text>

      <rect x="264" y="310" width="54" height="48" rx="14" fill="url(#btnNormal)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="291" y="341" text-anchor="middle" fill="#f0faf5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="600">6</text>

      <rect x="334" y="310" width="54" height="48" rx="14" fill="url(#btnFunc)" stroke="rgba(226,186,65,0.3)" stroke-width="1" />
      <text x="361" y="340" text-anchor="middle" fill="url(#gold)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="600">−</text>
    </g>

    <!-- Row 4 Buttons (1, 2, 3, +) -->
    <g filter="url(#btnShadow)">
      <rect x="124" y="370" width="54" height="48" rx="14" fill="url(#btnNormal)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="151" y="401" text-anchor="middle" fill="#f0faf5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="600">1</text>

      <rect x="194" y="370" width="54" height="48" rx="14" fill="url(#btnNormal)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="221" y="401" text-anchor="middle" fill="#f0faf5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="600">2</text>

      <rect x="264" y="370" width="54" height="48" rx="14" fill="url(#btnNormal)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="291" y="401" text-anchor="middle" fill="#f0faf5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="600">3</text>

      <!-- Equal / Plus Hero Gold Button -->
      <rect x="334" y="370" width="54" height="48" rx="14" fill="url(#gold)" stroke="#fae792" stroke-width="1.5" />
      <text x="361" y="401" text-anchor="middle" fill="#0c241c" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800">=</text>
    </g>
  </g>
</svg>
